name: FantasyCommandCenter

# Regenerate with:  cd apple && xcodegen generate
#
# The project file is generated rather than committed-and-hand-edited: the app
# target is a thin shell around three local packages, and a generated pbxproj
# cannot drift from the folder layout the way a hand-maintained one does.

options:
  bundleIdPrefix: com.connorbyrne
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  FCCore:
    path: Packages/FCCore
  FCData:
    path: Packages/FCData
  FCApp:
    path: Packages/FCApp

targets:
  FantasyCommandCenter:
    type: application
    # One multiplatform target rather than Catalyst (§2). The four screens are
    # list-shaped and adapt with NavigationSplitView on Mac, a tab bar on phone.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "Resources/**"
      # The nflverse files shipped at build time, so a first launch works with
      # no network (§9). Flattened into the bundle root, which is where
      # StaticDataStore looks when no subdirectory is given.
      - path: App/Resources
        buildPhase: resources
        type: folder.reference
        optional: true
    dependencies:
      - package: FCCore
        product: FCCore
      - package: FCData
        product: FCData
      - package: FCApp
        product: FCApp
    scheme:
      testTargets:
        - FantasyCommandCenterUITests
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Command Center
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # A personal relay on the home network or a tailnet can be plain http:
        # .local and bare hostnames need this; numeric IPs aren't under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorbyrne.FantasyCommandCenter
        # The paid team, same one the other apps here use. macOS will not build
        # at all without it because of the sandbox entitlement.
        DEVELOPMENT_TEAM: H9B7A5KQP3
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        # Sandbox is required for a Mac App Store / TestFlight build; the app
        # only needs outbound HTTPS to Sleeper.
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        CODE_SIGN_ENTITLEMENTS: App/FantasyCommandCenter.entitlements

  # UI tests run against the Debug-only demo league (-FCCDemoLeague): real 2025
  # data, no network. They check that every screen renders and that nothing is
  # wider than the phone — the Matchup sideways-drift regression.
  FantasyCommandCenterUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests
    dependencies:
      - target: FantasyCommandCenter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: H9B7A5KQP3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.connorbyrne.FantasyCommandCenterUITests
        TEST_TARGET_NAME: FantasyCommandCenter
        SWIFT_VERSION: "5.9"
