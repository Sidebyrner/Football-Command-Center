# The web app is a static single-page app: build with Vite, serve dist/, and
# answer every path with index.html so deep links (a reload on
# /lineup/injuries) open the right screen.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
